# Commun aux routes /ops/m/* (inclus par nginx.conf, location par location).
# Aucun en-tête du navigateur (cookie de session, jeton) ne part vers la supervision : seuls
# ceux posés ici. Chaque route envoie sa requête en POST de formulaire, corps fixé en dur.
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header Content-Type "application/x-www-form-urlencoded";
proxy_set_header Accept "application/json";
# En-tête Authorization du compte en lecture seule app-ops : secret Swarm ops_monitoring_auth
# (une ligne proxy_set_header). Absent hors Swarm (docker compose) : le motif ne trouve rien,
# nginx démarre quand même et la supervision répond 401, affichée « n/d ».
include /run/secrets/ops_monitoring_auth*;
proxy_connect_timeout 2s;
proxy_read_timeout 8s;
proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
proxy_hide_header Set-Cookie;
proxy_cache ops;
proxy_cache_key $uri;
proxy_cache_valid 200 5s;
proxy_cache_lock on;
proxy_cache_lock_timeout 8s;
