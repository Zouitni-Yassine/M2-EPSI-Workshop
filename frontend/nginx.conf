# Relais unique de la plateforme : le seul port publié. Tout passe par ici.
#
#   /                     l'application (fichiers statiques)
#   /auth/                service d'authentification : connexion, déconnexion, session, docs
#   /api/                 payment-api : paiements, journal (l'API exige elle-même la session)
#   /api/status           sonde de supervision          ─┐
#   /detector/score       score du détecteur ML          ├─ opérateurs seulement
#   /remediation/state    état du moteur de remédiation ─┘
#
# Ce qui n'est pas listé n'est pas joignable de l'extérieur : /metrics des services,
# /reset du détecteur, la base, le proxy Docker.

# Noms résolus en continu par le DNS interne de Docker (compose comme Swarm) : un conteneur
# recréé par la remédiation change d'adresse, le relais le suit sans redémarrer. Un service
# arrêté n'empêche pas le relais de démarrer.
resolver 127.0.0.11 valid=5s ipv6=off;

# max_fails=0 : pas de quarantaine après un échec. Sinon, une fois payment-api relancé par la
# remédiation, le relais le bouderait encore dix secondes.
upstream auth_svc        { zone auth_svc 64k;        server auth:8300 resolve max_fails=0; }
upstream api_svc         { zone api_svc 64k;         server payment-api:8000 resolve max_fails=0; }
upstream detector_svc    { zone detector_svc 64k;    server detector:8100 resolve max_fails=0; }
upstream remediation_svc { zone remediation_svc 64k; server remediation:8200 resolve max_fails=0; }

# Verdicts du service d'authentification pour la supervision, gardés 30 s. Si auth tombe,
# un opérateur déjà connecté garde son tableau de bord : le verdict périmé reste servi.
proxy_cache_path /var/cache/nginx/auth levels=1 keys_zone=verdicts:1m max_size=10m inactive=2h use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Le plus gros appel légitime est un paiement en JSON : quelques centaines d'octets.
    client_max_body_size 16k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Écrasé, jamais complété : un client ne peut pas se faire passer pour une autre adresse
    # auprès du freinage de la force brute (auth) ni dans les journaux.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    # Application monopage : toute route inconnue revient à index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /auth/ {
        proxy_pass http://auth_svc;
    }

    location /api/ {
        proxy_pass http://api_svc;
    }

    # ---- Supervision : la session doit être celle d'un opérateur, en lecture seule.

    location = /api/status {
        auth_request /_operator;
        limit_except GET { deny all; }
        proxy_pass http://api_svc;
    }

    location = /detector/score {
        auth_request /_operator;
        limit_except GET { deny all; }
        proxy_pass http://detector_svc/score;
    }

    location = /remediation/state {
        auth_request /_operator;
        limit_except GET { deny all; }
        proxy_pass http://remediation_svc/state;
    }

    location = /_operator {
        internal;
        proxy_pass http://auth_svc/auth/verify?role=operator;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_cache verdicts;
        proxy_cache_key "$cookie_rp_session|$http_authorization";
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    }
}
