# Relais unique de la plateforme : le seul port publié. Tout passe par ici.
#
#   /                     l'application (fichiers statiques)
#   /auth/                service d'authentification : connexion, déconnexion, session, docs
#   /api/                 payment-api : paiements, journal (l'API exige elle-même la session)
#   /api/status           sonde de supervision          ─┐
#   /detector/score       score du détecteur ML          ├─ opérateurs seulement
#   /remediation/state    état du moteur de remédiation ─┤
#   /ops/m/<nom>          supervision de la plateforme  ─┘ (VictoriaMetrics, Loki, Alertmanager)
#
# Ce qui n'est pas listé n'est pas joignable de l'extérieur : /metrics des services,
# /reset du détecteur, la base, le proxy Docker.

# Noms résolus en continu par le DNS interne de Docker (compose comme Swarm) : un conteneur
# recréé par la remédiation change d'adresse, le relais le suit sans redémarrer. Un service
# arrêté n'empêche pas le relais de démarrer.
resolver 127.0.0.11 valid=5s ipv6=off;

# max_fails=0 : pas de quarantaine après un échec. Sinon, une fois payment-api relancé par la
# remédiation, le relais le bouderait encore dix secondes.
upstream auth_svc        { zone auth_svc 64k;        server auth:8300 resolve max_fails=0; }
upstream api_svc         { zone api_svc 64k;         server payment-api:8000 resolve max_fails=0; }
upstream detector_svc    { zone detector_svc 64k;    server detector:8100 resolve max_fails=0; }
upstream remediation_svc { zone remediation_svc 64k; server remediation:8200 resolve max_fails=0; }

# Verdicts du service d'authentification pour la supervision, gardés 30 s. Si auth tombe,
# un opérateur déjà connecté garde son tableau de bord : le verdict périmé reste servi.
proxy_cache_path /var/cache/nginx/auth levels=1 keys_zone=verdicts:1m max_size=10m inactive=2h use_temp_path=off;

# Supervision de la plateforme (monitoring01, flux RA-APP -> 10.0.1.233 ports 3100 et 8428 déjà
# ouverts : règle UniFi ra-app-to-monitoring). Compte en LECTURE SEULE app-ops : vmauth (8428)
# n'accepte de lui que /api/v1/query ; le nginx de Loki (3100) que les requêtes Loki et la
# lecture des alertes d'Alertmanager (GET). Son en-tête Authorization est dans le secret Swarm
# ops_monitoring_auth (rôle app_stack), jamais dans l'image ni dans le dépôt.
upstream ops_vm   { server 10.0.1.233:8428 max_fails=0; }
upstream ops_loki { server 10.0.1.233:3100 max_fails=0; }
# Réponses partagées entre opérateurs pendant 5 s : quelques navigateurs ouverts ne multiplient
# pas les requêtes vers la supervision (les données ne bougent pas plus vite : scrape de 30 s).
proxy_cache_path /var/cache/nginx/ops levels=1 keys_zone=ops:1m max_size=5m inactive=1m use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Le plus gros appel légitime est un paiement en JSON : quelques centaines d'octets.
    client_max_body_size 16k;

    # Adresse réelle du client. Sur Swarm, chaque requête arrive par le réseau d'entrée
    # (ingress, 172.20.0.0/24, premier réseau du pool swarm_default_addr_pool) : sans cela,
    # tous les clients auraient l'adresse du nœud d'entrée et le freinage de la force brute
    # (auth) bloquerait tout le monde à la fois. Seul le WAF atteint le port publié depuis
    # l'extérieur ; il écrase X-Forwarded-For avec l'adresse qu'il a lui-même vérifiée.
    set_real_ip_from 172.20.0.0/24;
    real_ip_header X-Forwarded-For;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Écrasé, jamais complété : un client ne peut pas se faire passer pour une autre adresse
    # auprès du freinage de la force brute (auth) ni dans les journaux.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    # Application monopage : toute route inconnue revient à index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /auth/ {
        proxy_pass http://auth_svc;
    }

    # Reconnaissance faciale du back-office : images JPEG de la caméra (guidage, connexion et
    # enrôlement). Seules ces routes acceptent un corps plus gros que 16k.
    location ~ ^/auth/(identify/[A-Za-z0-9_-]+/(frames|probe)|admin/face/probe|admin/accounts/[^/]+/face(/scan)?)$ {
        client_max_body_size 4m;
        proxy_read_timeout 30s;
        proxy_pass http://auth_svc;
    }

    location /api/ {
        proxy_pass http://api_svc;
    }

    # ---- Supervision : la session doit être celle d'un opérateur, en lecture seule.

    location = /api/status {
        auth_request /_operator;
        limit_except GET { deny all; }
        proxy_pass http://api_svc;
    }

    location = /detector/score {
        auth_request /_operator;
        limit_except GET { deny all; }
        proxy_pass http://detector_svc/score;
    }

    location = /remediation/state {
        auth_request /_operator;
        limit_except GET { deny all; }
        proxy_pass http://remediation_svc/state;
    }

    # ---- Supervision de la plateforme : routes FIXES, aucune requête fournie par le client.
    # Chaque route porte sa requête en dur (corps POST vers l'API, jamais l'URL du client),
    # refuse tout paramètre (400) et toute méthode autre que GET. Session d'opérateur exigée.
    # Les requêtes ne contiennent ni « $ », ni « + », ni « ; » (variables nginx, encodage du
    # formulaire).

    # Débit, taux d'erreur (5xx) et p95 de TOUTES les requêtes de payment-api (2 min).
    location = /ops/m/traffic {
        auth_request /_operator;
        limit_except GET { deny all; }
        if ($args) { return 400; }
        include /etc/nginx/ops-proxy.conf;
        proxy_method POST;
        proxy_set_body 'query=label_replace(sum(rate(http_requests_total{service="paiement_payment-api"}[2m])), "m", "rps", "", "") or label_replace((sum(rate(http_requests_total{service="paiement_payment-api",code=~"5.."}[2m])) or vector(0)) / sum(rate(http_requests_total{service="paiement_payment-api"}[2m])), "m", "err", "", "") or label_replace(histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="paiement_payment-api"}[2m]))), "m", "p95", "", "")';
        proxy_pass http://ops_vm/api/v1/query;
    }

    # Hyperviseurs, nœuds Swarm, porteur de la VIP, Ceph, Vault, dernier paiement de la sonde.
    location = /ops/m/infra {
        auth_request /_operator;
        limit_except GET { deny all; }
        if ($args) { return 400; }
        include /etc/nginx/ops-proxy.conf;
        proxy_method POST;
        proxy_set_body 'query=label_replace(count(pve_up{id=~"node/.*"} == 1), "m", "pve_up", "", "") or label_replace(count(pve_up{id=~"node/.*"}), "m", "pve_total", "", "") or label_replace(max(swarm_manager_nodes{state="ready"}), "m", "swarm_ready", "", "") or label_replace(sum(max by (state) (swarm_manager_nodes)), "m", "swarm_total", "", "") or label_replace(max by (host) (app_vip_master) == 1, "m", "vip", "", "") or label_replace(max(ceph_health_status), "m", "ceph", "", "") or label_replace(min(vault_core_unsealed), "m", "vault", "", "") or label_replace(max(paiement_probe_last_success_timestamp_seconds{check="transaction"}), "m", "probe_ts", "", "") or label_replace(vector(time()), "m", "now", "", "")';
        proxy_pass http://ops_vm/api/v1/query;
    }

    # Requêtes refusées (403) par le WAF sur 15 min, bannies comprises (journaux de waf01).
    location = /ops/m/waf_blocks {
        auth_request /_operator;
        limit_except GET { deny all; }
        if ($args) { return 400; }
        include /etc/nginx/ops-proxy.conf;
        proxy_method POST;
        proxy_set_body 'query=sum(count_over_time({host="waf01",container="resilience-waf"} |= `"status":403` [15m]))';
        proxy_pass http://ops_loki/loki/api/v1/query;
    }

    # Décisions du récepteur de bannissement (ban, expiration, deban) des 30 dernières minutes.
    location = /ops/m/waf_bans {
        auth_request /_operator;
        limit_except GET { deny all; }
        if ($args) { return 400; }
        include /etc/nginx/ops-proxy.conf;
        proxy_method POST;
        proxy_set_body 'query={host="waf01",identifier="waf-ban"} |~ `^(ban|expiration|deban) `&since=30m&limit=200&direction=backward';
        proxy_pass http://ops_loki/loki/api/v1/query_range;
    }

    # Notifications envoyées sur Discord (copie webhook journalisée sur monitoring01), 6 h.
    location = /ops/m/notifications {
        auth_request /_operator;
        limit_except GET { deny all; }
        if ($args) { return 400; }
        include /etc/nginx/ops-proxy.conf;
        proxy_method POST;
        proxy_set_body 'query={host="monitoring01",job="alertmanager-notify"}&since=6h&limit=40&direction=backward';
        proxy_pass http://ops_loki/loki/api/v1/query_range;
    }

    # Alertes actives d'Alertmanager : lecture seule exposée par le nginx de monitoring01
    # (GET /api/v2/alerts, compte app-ops ; Alertmanager lui-même ne sait pas restreindre un compte).
    location = /ops/m/alerts {
        auth_request /_operator;
        limit_except GET { deny all; }
        if ($args) { return 400; }
        include /etc/nginx/ops-proxy.conf;
        proxy_method GET;
        proxy_pass http://ops_loki/alertmanager/alerts;
    }

    location = /_operator {
        internal;
        proxy_pass http://auth_svc/auth/verify?role=operator;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_cache verdicts;
        proxy_cache_key "$cookie_rp_session|$http_authorization";
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    }
}
