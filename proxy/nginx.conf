# Proxy vers le socket Docker, à liste blanche explicite.
#
# Le moteur de remédiation ne voit que ce proxy. Deux requêtes sont permises :
#   GET  /containers/json                  — lister
#   POST /containers/payment-api/restart   — redémarrer la seule cible
# Tout le reste répond 403 : pas de création, pas d'exec, pas d'arrêt, pas d'images.
#
# Les workers tournent en root pour lire le socket ; le conteneur, lui, est en
# lecture seule, sans aucune capacité, sur un réseau interne. Sa seule surface
# d'attaque est cette liste blanche.

user root;
worker_processes 1;
pid /tmp/nginx.pid;

events { worker_connections 64; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    upstream docker {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;

        location ~ ^/(v[0-9.]+/)?containers/json$ {
            limit_except GET { deny all; }
            proxy_pass http://docker;
        }

        location ~ ^/(v[0-9.]+/)?containers/payment-api/restart$ {
            limit_except POST { deny all; }
            proxy_pass http://docker;
        }

        location / {
            return 403;
        }
    }
}
