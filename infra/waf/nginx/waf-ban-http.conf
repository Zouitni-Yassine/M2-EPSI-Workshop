# Bannissement automatique (waf-ban) : inclus au début de default.conf, donc au niveau http.
# geo lit l'adresse du client après réécriture par realip (set_real_ip_from NPM dans le serveur
# 8443) : c'est l'IP réelle du client, pas celle de NPM.
geo $waf_banned {
    default 0;
    include /etc/nginx/waf-ban/banned/banned.conf;
}

# Refus pour une IP bannie, sauf /healthz
map "$waf_banned:$uri" $waf_ban_block {
    default 0;
    "~^1:/healthz$" 0;
    "~^1:" 1;
}
map $waf_ban_block $waf_log_normal {
    1 0;
    default 1;
}

# Requêtes refusées pour bannissement : même format que "security", event_type distinct
# (hors des règles qui comptent les 403 de ModSecurity)
log_format security_banned escape=json '{"timestamp":"$time_iso8601","service":"waf","event_type":"waf_banned","source_ip":"$remote_addr","request_id":"$request_id","method":"$request_method","route":"$uri","status":$status,"duration_s":$request_time}';
