# Pages servies par le WAF lui-même (inclus dans le serveur 8443 de default.conf), voir docs/waf.md
# Feuille de route du projet : infra/roadmap/index.html, mise à jour par waf-roadmap.yml sans
# rechargement (fichier lu sur le disque à chaque requête). Pas d'add_header ici : il
# annulerait les en-têtes de sécurité définis au niveau du serveur.
location = /roadmap {
    # Redirection relative : sinon nginx ajoute son port interne (8443), injoignable via NPM
    absolute_redirect off;
    return 301 /roadmap/;
}
location /roadmap/ {
    alias /etc/nginx/site/roadmap/;
    index index.html;
}
