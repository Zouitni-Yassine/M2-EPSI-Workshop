# Ajouts au serveur 8443 de default.conf (inclus au début du serveur), voir docs/waf.md
# Déployé par waf-roadmap.yml (copie dans /opt/resilience-waf/site/server-8443.conf + reload).
# Pas d'add_header ici : il annulerait les en-têtes de sécurité définis au niveau du serveur.

# Feuille de route du projet : infra/roadmap/index.html, mise à jour par waf-roadmap.yml sans
# rechargement (fichier lu sur le disque à chaque requête).
location = /roadmap {
    # Redirection relative : sinon nginx ajoute son port interne (8443), injoignable via NPM
    absolute_redirect off;
    return 301 /roadmap/;
}
location /roadmap/ {
    alias /etc/nginx/site/roadmap/;
    index index.html;
}

# Reconnaissance faciale des opérateurs : le navigateur envoie jusqu'à 8 images JPEG (400 ko
# max) en multipart/form-data. Seules ces routes acceptent 4 Mo (1 Mo ailleurs, nginx.conf de
# l'équipe cyber) et 30 s de réponse (calcul des empreintes). Même regex que le frontal
# (frontend/nginx.conf). ModSecurity reste actif : les images sont des parties « fichier »,
# hors SecRequestBodyNoFilesLimit (128 ko) et sous SecRequestBodyLimit (12,5 Mo) ; CRS
# n'inspecte que les noms de fichiers, pas leur contenu (testé le 22/10/2026, aucune exclusion).
location ~ "^/auth/(identify/[A-Za-z0-9_-]+/(frames|probe)|admin/face/probe|admin/accounts/[^/]+/face(/scan)?)$" {
    client_max_body_size 4m;
    proxy_pass http://10.30.1.200:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Proxy "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
