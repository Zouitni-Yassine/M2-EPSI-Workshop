# Assistant RAG de l'équipe IA (VM créée par infra/terraform/rag.tf, docs/rag.md)
#   cd /srv/M2-EPSI-Workshop/infra/ansible
#   vault-env ansible-playbook rag.yml
#   vault-env ansible-playbook rag.yml -e rag_git_ref=<sha complet de origin/IA>   # nouveau code
# Secrets lus dans Vault (secret/infra/*) par vault-env : mot de passe de Loki (Alloy), comptes
# LECTURE SEULE de la supervision (outils MCP), jeton de l'API de l'assistant, jeton du bot Discord.

- name: Assistant RAG (Ollama, ChromaDB, Streamlit)
  hosts: rag_servers
  pre_tasks:
    - name: Secret Loki présent dans l'environnement
      ansible.builtin.assert:
        that:
          - loki_auth_password | length >= 16
          - rag_vm_read_password | length >= 16
          - rag_loki_read_password | length >= 16
          - rag_api_token | length >= 32
          - (not (discord_bot_enabled | default(true) | bool)) or (discord_bot_token | length >= 50)
        fail_msg: "Secrets absents : lancer le playbook par vault-env (vault-env ansible-playbook ...)"
        quiet: true
      run_once: true
      delegate_to: localhost
      become: false
  roles:
    - rag
    - alloy
