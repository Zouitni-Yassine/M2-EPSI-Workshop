- name: Installer Grafana
  ansible.builtin.apt:
    name: grafana
    state: present

# admin_password n'est pris en compte qu'à la création de la base (premier démarrage)
- name: Configuration
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
  no_log: true
  notify: Redémarrer Grafana

- name: Sources de données
  ansible.builtin.template:
    src: "{{ monitoring_config_dir }}/grafana/datasources.yml.j2"
    dest: /etc/grafana/provisioning/datasources/monitoring.yml
    owner: root
    group: grafana
    mode: "0640"
  no_log: true # mots de passe des sources
  notify: Redémarrer Grafana

# Dashboards versionnés dans infra/monitoring/grafana/dashboards (générés par les scripts voisins).
# Un dossier = un dossier Grafana. Grafana relit les fichiers toutes les 60 s.
- name: Fournisseur de dashboards
  ansible.builtin.copy:
    dest: /etc/grafana/provisioning/dashboards/monitoring.yml
    content: |
      # Géré par Ansible
      apiVersion: 1
      providers:
        - name: monitoring
          type: file
          disableDeletion: false # un fichier retiré du dépôt retire le dashboard
          allowUiUpdates: false
          updateIntervalSeconds: 60
          options:
            path: /var/lib/grafana/dashboards
            foldersFromFilesStructure: true
    owner: root
    group: grafana
    mode: "0640"
  notify: Redémarrer Grafana

- name: Dashboards
  ansible.builtin.copy:
    src: "{{ monitoring_config_dir }}/grafana/dashboards/"
    dest: /var/lib/grafana/dashboards/
    owner: root
    group: grafana
    mode: "0644"
    directory_mode: "0755"

# copy n'efface rien : un dashboard retiré du dépôt doit aussi disparaître du serveur
- name: Dashboards présents sur le serveur
  ansible.builtin.find:
    paths: /var/lib/grafana/dashboards
    patterns: "*.json"
    recurse: true
  register: grafana_dashboards_found

- name: Supprimer les dashboards retirés du dépôt
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ grafana_dashboards_found.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: >-
    (item.path | relpath('/var/lib/grafana/dashboards')) not in
    (query('community.general.filetree', monitoring_config_dir ~ '/grafana/dashboards')
     | selectattr('state', 'eq', 'file') | map(attribute='path') | list)

- name: Appliquer les changements
  ansible.builtin.meta: flush_handlers

- name: Grafana actif
  ansible.builtin.systemd_service:
    name: grafana-server
    enabled: true
    state: started
