- name: Paquets
  ansible.builtin.apt:
    name: [unzip, jq]
    state: present

- name: Utilisateur système vault
  ansible.builtin.user:
    name: vault
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/vault
    create_home: false

- name: Répertoires
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "/opt/vault/{{ vault_version }}" }
    - { path: /etc/vault.d, group: vault, mode: "0750" }
    - { path: /var/lib/vault, owner: vault, group: vault, mode: "0700" }
    - { path: /var/lib/vault/data, owner: vault, group: vault, mode: "0700" } # stockage Raft

- name: Télécharger Vault {{ vault_version }}
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip"
    checksum: "sha256:https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_SHA256SUMS"
    dest: "/opt/vault/{{ vault_version }}/vault.zip"
    mode: "0644"

- name: Extraire Vault
  ansible.builtin.unarchive:
    src: "/opt/vault/{{ vault_version }}/vault.zip"
    dest: "/opt/vault/{{ vault_version }}"
    remote_src: true
    creates: "/opt/vault/{{ vault_version }}/vault"

- name: Version active
  ansible.builtin.file:
    src: "/opt/vault/{{ vault_version }}/vault"
    dest: /usr/local/bin/vault
    state: link
  notify: Redémarrer Vault

- name: Certificat TLS
  ansible.builtin.include_role:
    name: internal_ca
    tasks_from: issue
  vars:
    cert_dest_dir: /etc/vault.d
    cert_group: vault
    cert_notify: Redémarrer Vault

- name: Configuration
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: /etc/vault.d/vault.hcl
    owner: root
    group: vault
    mode: "0640"
  notify: Redémarrer Vault

- name: Service systemd
  ansible.builtin.template:
    src: vault.service.j2
    dest: /etc/systemd/system/vault.service
    mode: "0644"
  notify: Redémarrer Vault

- name: Variables du CLI pour root
  ansible.builtin.copy:
    dest: /etc/profile.d/vault.sh
    content: |
      export VAULT_ADDR=https://127.0.0.1:8200
    mode: "0644"

- name: Appliquer les changements
  ansible.builtin.meta: flush_handlers

- name: Vault actif
  ansible.builtin.systemd_service:
    name: vault
    enabled: true
    state: started
    daemon_reload: true

- name: Initialisation et descellement
  ansible.builtin.include_tasks: init.yml

- name: Politiques, AppRole et compte de secours
  ansible.builtin.include_tasks: config.yml
