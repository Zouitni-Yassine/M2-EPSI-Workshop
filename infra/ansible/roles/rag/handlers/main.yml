- name: Recharger nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Redémarrer Ollama
  ansible.builtin.systemd_service:
    name: ollama
    state: restarted
    daemon_reload: true

- name: Redémarrer l'assistant
  ansible.builtin.systemd_service:
    name: rag-assistant
    state: restarted
    daemon_reload: true
