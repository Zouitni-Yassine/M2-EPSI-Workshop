- name: Installer Loki
  ansible.builtin.apt:
    name: loki
    state: present

- name: Répertoire de données
  ansible.builtin.file:
    path: /var/lib/loki
    state: directory
    owner: loki
    mode: "0750"

# Envoi des alertes du ruler à Alertmanager : en-tête "Authorization: Basic <base64>" lu dans
# ce fichier, lisible par Loki seul
- name: Identifiants Alertmanager du ruler
  ansible.builtin.copy:
    dest: /etc/loki/alertmanager.credentials
    content: "{{ (monitoring_auth_user ~ ':' ~ alertmanager_auth_password) | b64encode }}"
    owner: loki
    group: root
    mode: "0400"
  no_log: true
  notify: Redémarrer Loki

# Règles versionnées dans infra/monitoring/loki/rules (copiées sans template)
- name: Répertoire des règles
  ansible.builtin.file:
    path: /etc/loki/rules/fake
    state: directory
    mode: "0755"

- name: Règles d'alerte sur les logs
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/loki/rules/fake/
    mode: "0644"
  loop: "{{ query('ansible.builtin.fileglob', monitoring_config_dir ~ '/loki/rules/*.yml') }}"

- name: Règles présentes sur le serveur
  ansible.builtin.find:
    paths: /etc/loki/rules/fake
    patterns: "*.yml"
  register: loki_rules_present

- name: Supprimer les règles retirées du dépôt
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ loki_rules_present.files | map(attribute='path') | map('basename')
            | reject('in', query('ansible.builtin.fileglob', monitoring_config_dir ~ '/loki/rules/*.yml') | map('basename') | list)
            | map('regex_replace', '^', '/etc/loki/rules/fake/') | list }}"

# Ancien emplacement des règles cyber (avant leur passage dans le dépôt, 20/10/2026)
- name: Ancien répertoire de règles
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: [/etc/loki/rules-cyber, /var/lib/loki/ruler-cyber]

- name: Configuration (single binary, stockage local)
  ansible.builtin.template:
    src: "{{ monitoring_config_dir }}/loki/config.yml.j2"
    dest: /etc/loki/config.yml
    owner: root
    group: root
    mode: "0644" # pas de secret ; le paquet ne crée pas de groupe loki
    validate: loki -config.file=%s -verify-config
  notify: Redémarrer Loki

# Loki n'a pas d'authentification intégrée : nginx en reverse proxy devant (méthode documentée par Grafana)
- name: Installer nginx
  ansible.builtin.apt:
    name: nginx-light
    state: present

- name: Pas de site par défaut (port 80)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Recharger nginx

# SHA-512 crypt à 5000 tours : nginx vérifie le mot de passe à chaque requête (un push Alloy
# par seconde et par hôte), bcrypt y coûterait trop cher. Sel déterministe : tâche idempotente.
# Second compte : lecture seule de l'assistant RAG (routes filtrées dans nginx-loki.conf.j2)
- name: Utilisateurs autorisés
  ansible.builtin.copy:
    dest: /etc/nginx/loki.htpasswd
    content: |
      {{ monitoring_auth_user }}:{{ loki_auth_password | password_hash('sha512', salt=((inventory_hostname ~ '-loki') | hash('sha256'))[:16], rounds=5000) }}
      {{ rag_readonly_user }}:{{ rag_loki_read_password | password_hash('sha512', salt=((inventory_hostname ~ '-loki-ro') | hash('sha256'))[:16], rounds=5000) }}
      {{ app_ops_user }}:{{ app_ops_read_password | password_hash('sha512', salt=((inventory_hostname ~ '-loki-app-ops') | hash('sha256'))[:16], rounds=5000) }}
    owner: root
    group: www-data
    mode: "0640"
  no_log: true

# Relais en lecture seule vers Alertmanager (compte {{ app_ops_user }}) : en-tête lu par nginx
# (processus maître, root) au chargement, dans un fichier séparé de la configuration
- name: Identifiants Alertmanager du relais en lecture seule
  ansible.builtin.copy:
    dest: /etc/nginx/alertmanager-app-ops.auth
    content: |
      proxy_set_header Authorization "Basic {{ (app_ops_user ~ ':' ~ app_ops_am_password) | b64encode }}";
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Recharger nginx

# Journal des notifications Discord (copie webhook d'Alertmanager), suivi par Alloy
- name: Répertoire du journal des notifications
  ansible.builtin.file:
    path: "{{ alertmanager_notify_log_dir }}"
    state: directory
    owner: root
    group: adm
    mode: "0750"

- name: Rotation du journal des notifications
  ansible.builtin.copy:
    dest: /etc/logrotate.d/alertmanager-notify
    content: |
      # Géré par Ansible (rôle loki)
      {{ alertmanager_notify_log_dir }}/*.log {
          daily
          rotate 7
          missingok
          notifempty
          compress
          delaycompress
          create 0640 root adm
          sharedscripts
          postrotate
              invoke-rc.d nginx rotate >/dev/null 2>&1 || true
          endscript
      }
    mode: "0644"

- name: Reverse proxy authentifiant
  ansible.builtin.template:
    src: "{{ monitoring_config_dir }}/loki/nginx-loki.conf.j2"
    dest: /etc/nginx/sites-available/loki.conf
    mode: "0644"
  notify: Recharger nginx

- name: Activer le reverse proxy
  ansible.builtin.file:
    src: /etc/nginx/sites-available/loki.conf
    dest: /etc/nginx/sites-enabled/loki.conf
    state: link
  notify: Recharger nginx

- name: Configuration nginx valide
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Appliquer les changements
  ansible.builtin.meta: flush_handlers

- name: Loki et nginx actifs
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [loki, nginx]
