# Passerelle de remédiation : le moteur (service Swarm sur les workers) agit sur le cluster
# en SSH vers un manager, avec une clé limitée à une liste fermée d'actions. Il n'a jamais
# accès au socket Docker (équivalent root sur tout le cluster).

- name: Répertoire de la clé du moteur sur le poste de contrôle
  ansible.builtin.file:
    path: "{{ remediation_key_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  run_once: true
  become: false

- name: Clé du moteur sur le poste de contrôle
  ansible.builtin.command:
    cmd: ssh-keygen -q -t ed25519 -N "" -C remediation-engine -f {{ remediation_key_dir }}/id_ed25519
    creates: "{{ remediation_key_dir }}/id_ed25519"
  delegate_to: localhost
  run_once: true
  become: false

- name: Lire la clé publique
  ansible.builtin.set_fact:
    remediation_pubkey: "{{ lookup('ansible.builtin.file', remediation_key_dir ~ '/id_ed25519.pub') }}"

- name: Utilisateur remediation (pas de mot de passe, connexion par clé uniquement)
  ansible.builtin.user:
    name: remediation
    system: true
    shell: /bin/sh
    password: "*"
    create_home: true
    home: /home/remediation

# Clé et répertoire appartenant à root : l'utilisateur ne peut pas modifier ses propres accès
- name: Répertoire .ssh
  ansible.builtin.file:
    path: /home/remediation/.ssh
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Clé autorisée (commande forcée, sources limitées aux workers)
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: /home/remediation/.ssh/authorized_keys
    owner: root
    group: root
    mode: "0644"

- name: Scripts de la passerelle
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - { src: remediate, dest: /usr/local/sbin/remediate }
    - { src: remediate-ssh, dest: /usr/local/bin/remediate-ssh }

- name: Répertoires de configuration et d'état
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /etc/remediation
    - /var/lib/remediation

- name: Politique (stacks autorisées, bornes, limites)
  ansible.builtin.template:
    src: policy.json.j2
    dest: /etc/remediation/policy.json
    owner: root
    group: root
    mode: "0600"

- name: Droit sudo limité à la passerelle
  ansible.builtin.copy:
    dest: /etc/sudoers.d/remediation
    content: |
      # Géré par Ansible
      Defaults!/usr/local/sbin/remediate env_keep += "SSH_CLIENT"
      remediation ALL=(root) NOPASSWD: /usr/local/sbin/remediate
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

# Empreintes des managers : le moteur vérifie l'hôte (pas de confiance au premier contact)
- name: Clé d'hôte SSH
  ansible.builtin.slurp:
    src: /etc/ssh/ssh_host_ed25519_key.pub
  register: remediation_hostkey

- name: Clé privée du moteur (secret Swarm)
  community.docker.docker_secret:
    name: remediation_ssh_key
    data: "{{ lookup('ansible.builtin.file', remediation_key_dir ~ '/id_ed25519') }}\n"
    labels:
      com.epsi.usage: remediation
  no_log: true
  run_once: true

- name: Mot de passe Alertmanager du moteur (secret Swarm)
  community.docker.docker_secret:
    name: remediation_alertmanager_password
    data: "{{ remediation_am_password }}"
    labels:
      com.epsi.usage: remediation
  no_log: true
  run_once: true

# Empreintes de TOUS les managers (pas seulement ceux du passage : un --limit produisait une
# config incomplète, constaté le 20/10). Config immuable : nom = empreinte du contenu, les
# consommateurs (stack paiement, test-passerelle.sh) la retrouvent par le label
# com.epsi.remediation=known_hosts.
- name: Empreintes de tous les managers disponibles
  ansible.builtin.assert:
    that: groups['swarm_managers'] | difference(ansible_play_hosts) | length == 0
    fail_msg: "Lancer ce rôle sur tous les managers (pas de --limit partiel) : les empreintes seraient incomplètes"
    quiet: true
  run_once: true

- name: Contenu des empreintes
  ansible.builtin.set_fact:
    remediation_known_hosts_data: |
      {% for h in groups['swarm_managers'] %}
      {{ hostvars[h].ansible_host }} {{ (hostvars[h].remediation_hostkey.content | b64decode).split()[:2] | join(' ') }}
      {% endfor %}
  run_once: true

- name: Empreintes des managers (config Swarm)
  community.docker.docker_config:
    name: "remediation_known_hosts_{{ remediation_known_hosts_data | hash('sha256') | truncate(12, true, '') }}"
    data: "{{ remediation_known_hosts_data }}"
    labels:
      com.epsi.usage: remediation
      com.epsi.remediation: known_hosts
  run_once: true

- name: Configs d'empreintes présentes
  ansible.builtin.command: docker config ls --filter label=com.epsi.usage=remediation --format "{{ '{{' }}.Name{{ '}}' }}"
  register: remediation_kh_configs
  changed_when: false
  run_once: true

# Une config encore utilisée par un service ne peut pas être supprimée : elle le sera au passage
# suivant (après redéploiement de la stack qui l'utilise). Inclut l'ancien nom fixe.
- name: Supprimer les anciennes configs d'empreintes
  community.docker.docker_config:
    name: "{{ item }}"
    state: absent
  loop: "{{ remediation_kh_configs.stdout_lines | select('match', '^remediation_known_hosts')
            | reject('equalto', 'remediation_known_hosts_' ~ (remediation_known_hosts_data | hash('sha256') | truncate(12, true, ''))) | list }}"
  failed_when: false
  run_once: true
