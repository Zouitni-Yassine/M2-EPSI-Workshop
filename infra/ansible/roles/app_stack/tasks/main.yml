# Stack applicative "Resilience Pay" sur le Swarm (sur swarm_managers[0]).
# Secrets et configs Swarm immuables : le nom porte une empreinte salée et tronquée du contenu,
# une rotation dans Vault crée un nouveau secret et met à jour les services qui l'utilisent ;
# les anciens sont supprimés en fin de rôle (au passage suivant s'ils sont encore utilisés).

- name: Module docker_stack (dépendance Python)
  ansible.builtin.apt:
    name: python3-jsondiff
    state: present

- name: Répertoire de la stack
  ansible.builtin.file:
    path: "{{ app_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Noms versionnés des secrets
  ansible.builtin.set_fact:
    app_swarm_secrets: >-
      {{ app_swarm_secrets | default({}) | combine({item.key: app_stack_name ~ '_' ~ item.key ~ '_'
         ~ (('app-stack-secret:' ~ app_stack_name ~ ':' ~ item.key ~ ':' ~ item.value) | hash('sha256'))[:12]}) }}
  loop: "{{ app_secret_values | dict2items | rejectattr('value', 'equalto', '') | list }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Secrets de l'application (secrets Swarm)
  community.docker.docker_secret:
    name: "{{ item.value }}"
    data: "{{ app_secret_values[item.key] }}"
    labels:
      com.epsi.usage: "{{ app_stack_name }}"
  loop: "{{ app_swarm_secrets | dict2items }}"
  no_log: true

# Script versionné dans le dépôt (db/init/01-roles.sh). Dépôt en sparse checkout (seul infra/
# extrait) : lu dans le commit courant.
- name: Script d'initialisation de la base
  ansible.builtin.set_fact:
    app_db_init: >-
      {{ lookup('ansible.builtin.file', app_repo_dir ~ '/db/init/01-roles.sh')
         if (app_repo_dir ~ '/db/init/01-roles.sh') is exists
         else lookup('ansible.builtin.pipe', 'git -C ' ~ (app_repo_dir | quote) ~ ' show HEAD:db/init/01-roles.sh') }}

- name: Nom versionné de la config d'initialisation
  ansible.builtin.set_fact:
    app_db_init_config_name: "{{ app_stack_name }}_db_init_{{ (app_db_init | hash('sha1'))[:12] }}"

- name: Initialisation de la base (config Swarm)
  community.docker.docker_config:
    name: "{{ app_db_init_config_name }}"
    data: "{{ app_db_init }}\n"
    labels:
      com.epsi.usage: "{{ app_stack_name }}"

# Identifiants stockés dans /root/.docker/config.json du manager : transmis aux workers par
# with_registry_auth pour qu'ils tirent les images du registre privé
- name: Connexion au registre privé
  community.docker.docker_login:
    registry_url: "{{ app_registry }}"
    username: "{{ app_registry_username }}"
    password: "{{ app_registry_password }}"
  no_log: true

# Base haute disponibilité (app_db_mode ha ou migration) : image PostgreSQL + Patroni construite
# sur le manager (même principe que la sonde : tag = empreinte des sources, reconstruite
# seulement si elles changent), configuration de Patroni en config Swarm versionnée
- name: Base haute disponibilité (image, configuration)
  when: app_db_mode != 'single'
  block:
    - name: Tag de l'image PostgreSQL + Patroni (empreinte des sources)
      ansible.builtin.set_fact:
        app_db_image_ref: >-
          {{ app_registry }}/{{ app_db_image_name }}:{{ (lookup('ansible.builtin.pipe', 'cd '
             ~ (app_db_image_src | quote) ~ ' && sha256sum ' ~ (app_db_image_files | map('quote') | join(' ')))
             | hash('sha256'))[:12] }}

    - name: Image déjà dans le registre ?
      ansible.builtin.uri:
        url: "https://{{ app_registry }}/v2/{{ app_db_image_name }}/manifests/{{ app_db_image_ref.split(':')[-1] }}"
        method: HEAD
        url_username: "{{ app_registry_username }}"
        url_password: "{{ app_registry_password }}"
        force_basic_auth: true
        headers:
          Accept: >-
            application/vnd.oci.image.index.v1+json,
            application/vnd.oci.image.manifest.v1+json,
            application/vnd.docker.distribution.manifest.list.v2+json,
            application/vnd.docker.distribution.manifest.v2+json
        status_code: [200, 404]
      register: app_db_image_present
      changed_when: false
      no_log: true

    - name: Construire et pousser l'image
      when: app_db_image_present.status == 404
      block:
        - name: Dossier de construction
          ansible.builtin.file:
            path: "{{ app_db_build_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Sources de l'image
          ansible.builtin.copy:
            src: "{{ app_db_image_src }}/{{ item }}"
            dest: "{{ app_db_build_dir }}/{{ item }}"
            owner: root
            group: root
            mode: "{{ '0644' if item == 'Dockerfile' else '0755' }}"
          loop: "{{ app_db_image_files }}"

        - name: docker build
          ansible.builtin.command:
            argv: [docker, build, --quiet, --pull, -t, "{{ app_db_image_ref }}",
                   --label, org.opencontainers.image.title=paiement-postgres, "{{ app_db_build_dir }}"]

        - name: docker push
          ansible.builtin.command: docker push --quiet {{ app_db_image_ref }}

    - name: Configuration de Patroni
      ansible.builtin.set_fact:
        app_patroni_config: "{{ lookup('ansible.builtin.template', app_db_image_src ~ '/patroni.yml.j2') }}"

    - name: Nom versionné de la configuration de Patroni
      ansible.builtin.set_fact:
        app_patroni_config_name: "{{ app_stack_name }}_patroni_{{ (app_patroni_config | hash('sha1'))[:12] }}"

    - name: Configuration de Patroni (config Swarm)
      community.docker.docker_config:
        name: "{{ app_patroni_config_name }}"
        data: "{{ app_patroni_config }}"
        labels:
          com.epsi.usage: "{{ app_stack_name }}"

# Config des empreintes des managers, créée par le rôle remediation_gateway (nom versionné)
- name: Config d'empreintes de la passerelle de remédiation
  ansible.builtin.shell: >-
    docker config ls --filter label=com.epsi.remediation=known_hosts
    --format '{{ '{{' }}.CreatedAt{{ '}}' }} {{ '{{' }}.Name{{ '}}' }}' | sort | tail -n 1 | awk '{print $NF}'
  register: app_known_hosts_config
  changed_when: false
  failed_when: app_known_hosts_config.stdout | length == 0

- name: Fichier de stack
  ansible.builtin.template:
    src: "{{ app_stack_template }}"
    dest: "{{ app_stack_dir }}/stack.yml"
    owner: root
    group: root
    mode: "0600"

- name: Stack {{ app_stack_name }}
  community.docker.docker_stack:
    name: "{{ app_stack_name }}"
    compose:
      - "{{ app_stack_dir }}/stack.yml"
    with_registry_auth: true
    state: present

# docker stack deploy ne retire pas un service absent du fichier : l'ancienne base unique est
# supprimée ici une fois la bascule faite (mode ha). Son volume db-data reste sur {{ app_db_node }}
# (retour arrière : -e app_db_mode=single).
- name: Ancienne base unique encore présente ?
  ansible.builtin.command: docker service inspect --format '{{ '{{' }}.ID{{ '}}' }}' {{ app_stack_name }}_db
  register: app_legacy_db
  changed_when: false
  failed_when: false
  when: app_db_mode == 'ha'

- name: Retirer l'ancienne base unique (volume db-data conservé)
  ansible.builtin.command: docker service rm {{ app_stack_name }}_db
  when: app_db_mode == 'ha' and app_legacy_db.rc == 0

- name: Secrets présents
  ansible.builtin.command: docker secret ls --filter label=com.epsi.usage={{ app_stack_name }} --format "{{ '{{' }}.Name{{ '}}' }}"
  register: app_secrets_present
  changed_when: false

- name: Supprimer les anciens secrets
  community.docker.docker_secret:
    name: "{{ item }}"
    state: absent
  loop: "{{ app_secrets_present.stdout_lines | reject('in', app_swarm_secrets.values() | list) | list }}"
  failed_when: false

- name: Configs présentes
  ansible.builtin.command: docker config ls --filter label=com.epsi.usage={{ app_stack_name }} --format "{{ '{{' }}.Name{{ '}}' }}"
  register: app_configs_present
  changed_when: false

- name: Supprimer les anciennes configs
  community.docker.docker_config:
    name: "{{ item }}"
    state: absent
  loop: >-
    {{ app_configs_present.stdout_lines | reject('equalto', app_db_init_config_name)
       | reject('equalto', app_patroni_config_name | default('')) | list }}
  failed_when: false
