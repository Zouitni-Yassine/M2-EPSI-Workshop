- name: Redémarrer Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted

- name: Recharger nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Redémarrer journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
