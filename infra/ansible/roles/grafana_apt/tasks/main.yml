# Dépôt APT officiel Grafana Labs (Grafana, Loki, Alloy)
- name: Répertoire des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Clé du dépôt Grafana
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Dépôt Grafana
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/grafana.sources
    content: |
      Types: deb
      URIs: https://apt.grafana.com
      Suites: stable
      Components: main
      Signed-By: /etc/apt/keyrings/grafana.asc
    mode: "0644"
  register: grafana_apt_repo

- name: Mettre à jour l'index APT
  ansible.builtin.apt:
    update_cache: true
  when: grafana_apt_repo is changed
