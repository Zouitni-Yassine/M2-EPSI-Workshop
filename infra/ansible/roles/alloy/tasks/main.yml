# Grafana Alloy : expédie le journal systemd (y compris les logs des conteneurs) vers Loki
- name: Installer Alloy
  ansible.builtin.apt:
    name: alloy
    state: present

# Lecture du journal en lecture seule, sans accès au socket Docker
- name: Accès de l'utilisateur alloy au journal
  ansible.builtin.user:
    name: alloy
    groups: systemd-journal
    append: true
  notify: Redémarrer Alloy

# Fichiers de logs hors journald : lecture par ACL sur leur répertoire (fichiers existants,
# et ACL par défaut pour ceux que logrotate recrée), sans ajouter alloy à un groupe plus large
# (ex. www-data peut lire /etc/pve sur un hyperviseur)
- name: Paquet acl
  ansible.builtin.apt:
    name: acl
    state: present
  when: alloy_log_files | default([]) | length > 0

# Répertoire créé ici quand le journal n'existe pas encore (mkdir: true dans alloy_log_files),
# ex. le journal des notifications d'Alertmanager, écrit par nginx après ce rôle
- name: Répertoires de logs à créer
  ansible.builtin.file:
    path: "{{ item.path | dirname }}"
    state: directory
    owner: root
    group: adm
    mode: "0750"
  loop: "{{ alloy_log_files | default([]) | selectattr('mkdir', 'defined') | selectattr('mkdir') | list }}"
  loop_control:
    label: "{{ item.path | dirname }}"

- name: ACL des répertoires de logs suivis
  ansible.posix.acl:
    path: "{{ item.0 }}"
    entity: alloy
    etype: user
    permissions: "{{ 'rx' if item.1 == 'access' else 'r' }}"
    default: "{{ item.1 == 'default' }}"
    state: present
  loop: "{{ alloy_log_files | default([]) | map(attribute='path') | map('dirname') | unique | product(['access', 'default']) | list }}"

- name: Fichiers de logs suivis déjà présents
  ansible.builtin.find:
    paths: "{{ item.path | dirname }}"
    patterns: "{{ item.path | basename }}"
  loop: "{{ alloy_log_files | default([]) }}"
  register: alloy_existing_logs

- name: ACL des fichiers de logs suivis
  ansible.posix.acl:
    path: "{{ item }}"
    entity: alloy
    etype: user
    permissions: r
    state: present
  loop: "{{ alloy_existing_logs.results | map(attribute='files') | flatten | map(attribute='path') | list }}"

- name: Mot de passe de Loki
  ansible.builtin.copy:
    dest: /etc/alloy/loki_password
    content: "{{ loki_auth_password }}"
    owner: root
    group: alloy
    mode: "0640"
  no_log: true
  notify: Redémarrer Alloy

- name: Configuration
  ansible.builtin.template:
    src: "{{ monitoring_config_dir }}/alloy/config.alloy.j2"
    dest: /etc/alloy/config.alloy
    mode: "0644"
    validate: alloy fmt %s
  notify: Redémarrer Alloy

# Interface et métriques d'Alloy en local uniquement
- name: Options de démarrage
  ansible.builtin.copy:
    dest: /etc/default/alloy
    content: |
      CONFIG_FILE="/etc/alloy/config.alloy"
      CUSTOM_ARGS="--server.http.listen-addr=127.0.0.1:12345 --disable-reporting"
      RESTART_ON_UPGRADE=true
    mode: "0644"
  notify: Redémarrer Alloy

- name: Appliquer les changements
  ansible.builtin.meta: flush_handlers

- name: Alloy actif
  ansible.builtin.systemd_service:
    name: alloy
    enabled: true
    state: started
