# Sauvegarde logique de la base de l'application (pg_dump), depuis le poste de contrôle : hors des
# workers qui portent la base (volumes locaux), et incluse dans la sauvegarde PBS de .110.
db_backup_dir: /var/backups/paiement
db_backup_calendar: "*:0/15"     # toutes les 15 min : perte de données maximale de 15 min
db_backup_keep: 96               # dumps gardés par base (24 h à 15 min)
db_backup_databases: [payments, auth]
# Conteneurs PostgreSQL de la stack (label posé par infra/app/paiement-stack.yml.j2) : le dump
# vise celui qui n'est pas en recouvrement, le primaire (il change de nœud à chaque bascule)
db_backup_label: paiement
db_backup_ssh_key: /root/.ssh/id_ed25519_infra
