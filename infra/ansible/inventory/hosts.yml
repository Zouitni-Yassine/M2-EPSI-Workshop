# Doit rester aligné avec infra/terraform/swarm.tf et monitoring.tf
# pve_node : hôte Proxmox, exposé en label Swarm pour répartir les réplicas par machine physique
all:
  children:
    # VLAN 301 RA-APP (10.30.1.0/24), cf. infra/unifi/ra-network.yml
    swarm:
      children:
        swarm_managers:
          hosts:
            dockermgr01: { ansible_host: 10.30.1.211, pve_node: ceph01 }
            dockermgr02: { ansible_host: 10.30.1.212, pve_node: ceph02 }
            dockermgr03: { ansible_host: 10.30.1.213, pve_node: ceph03 }
        swarm_workers:
          hosts:
            dockerwrk01: { ansible_host: 10.30.1.221, pve_node: ceph01 }
            dockerwrk02: { ansible_host: 10.30.1.222, pve_node: ceph02 }
            dockerwrk03: { ansible_host: 10.30.1.223, pve_node: ceph03 }

    # LXC : pas d'utilisateur debian, connexion root par clé uniquement
    monitoring:
      vars:
        ansible_user: root
      children:
        vmagents:
          hosts:
            vmagent01: { ansible_host: 10.0.1.231, pve_node: ceph02 }
            vmagent02: { ansible_host: 10.0.1.232, pve_node: ceph03 }
        monitoring_core:
          hosts:
            monitoring01: { ansible_host: 10.0.1.233, pve_node: ceph01 }

    # Identités et secrets (infra/terraform/identity.tf), connexion root par clé
    identity:
      vars:
        ansible_user: root
      children:
        keycloak_servers:
          hosts:
            iam01: { ansible_host: 10.0.1.241, pve_node: ceph02 }
        vault_servers:
          hosts:
            vault01: { ansible_host: 10.0.1.242, pve_node: ceph03 }
        vaultwarden_servers:
          hosts:
            vaultwarden01: { ansible_host: 10.0.1.243, pve_node: ceph01 }

    # Hyperviseurs : cibles de supervision ; seuls la CA interne, le SSO (identity.yml) et
    # l'envoi des logs (monitoring.yml) y sont gérés par Ansible
    pve:
      hosts:
        ceph01: { ansible_host: 10.0.1.100, pve_node: ceph01 }
        ceph02: { ansible_host: 10.0.1.101, pve_node: ceph02 }
        ceph03: { ansible_host: 10.0.1.102, pve_node: ceph03 }

    # Poste de contrôle (LXC 100) : Ansible s'exécute ici, connexion locale
    control:
      hosts:
        control01: { ansible_host: 10.0.1.110, ansible_connection: local, pve_node: ceph01 }

    # WAF de l'équipe cyber (VM 251, hors Terraform) : seul l'envoi des logs y est géré
    waf:
      hosts:
        waf01: { ansible_host: 10.0.1.251, pve_node: ceph01 }
