# Doit rester aligné avec infra/terraform/swarm.tf et monitoring.tf
# pve_node : hôte Proxmox, exposé en label Swarm pour répartir les réplicas par machine physique
all:
  children:
    swarm:
      children:
        swarm_managers:
          hosts:
            dockermgr01: { ansible_host: 10.0.1.211, pve_node: ceph01 }
            dockermgr02: { ansible_host: 10.0.1.212, pve_node: ceph02 }
            dockermgr03: { ansible_host: 10.0.1.213, pve_node: ceph03 }
        swarm_workers:
          hosts:
            dockerwrk01: { ansible_host: 10.0.1.221, pve_node: ceph01 }
            dockerwrk02: { ansible_host: 10.0.1.222, pve_node: ceph02 }
            dockerwrk03: { ansible_host: 10.0.1.223, pve_node: ceph03 }

    # LXC : pas d'utilisateur debian, connexion root par clé uniquement
    monitoring:
      vars:
        ansible_user: root
      children:
        vmagents:
          hosts:
            vmagent01: { ansible_host: 10.0.1.231, pve_node: ceph02 }
            vmagent02: { ansible_host: 10.0.1.232, pve_node: ceph03 }
        monitoring_core:
          hosts:
            monitoring01: { ansible_host: 10.0.1.233, pve_node: ceph01 }

    # Hyperviseurs : utilisés comme cibles de supervision, aucun playbook ne les configure
    pve:
      hosts:
        ceph01: { ansible_host: 10.0.1.100, pve_node: ceph01 }
        ceph02: { ansible_host: 10.0.1.101, pve_node: ceph02 }
        ceph03: { ansible_host: 10.0.1.102, pve_node: ceph03 }
