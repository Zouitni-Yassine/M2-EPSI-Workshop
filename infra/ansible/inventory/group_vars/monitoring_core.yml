fw_open_ports:
  - 3000 # Grafana
  - 3100 # Loki (push des logs)
  - 8428 # VictoriaMetrics (remote write des vmagents, vmui)
  - 8880 # vmalert
  - 9093 # Alertmanager
  - 9100 # node_exporter

# Accessibles aussi depuis le VPN d'administration (fw_admin_web_allowed)
fw_admin_ports:
  - 3000 # Grafana
  - 8428 # vmui
  - 8880 # vmalert
  - 9093 # Alertmanager

# Accès Grafana de Rémi via son profil WireGuard personnel
fw_grafana_allowed:
  - "10.250.90.9/32"

# Flux depuis les segments RA (mêmes ports que les règles UniFi ra-app-to-monitoring, ra-dmz-to-loki)
fw_segment_rules:
  - { source: "{{ ra_app_cidr }}", ports: [3100, 8428, 9093], comment: "RA-APP : logs, metriques, alertes" }
  - { source: "{{ ra_dmz_cidr }}", ports: [3100], comment: "RA-DMZ : logs" }

# Journal des notifications envoyées sur Discord (panneau Alertes du back-office) : le
# récepteur discord d'Alertmanager en envoie aussi une copie webhook au nginx local (port
# 127.0.0.1 seulement), qui l'écrit dans ce fichier, suivi par Alloy (job alertmanager-notify).
alertmanager_notify_port: 9097
alertmanager_notify_log_url: "http://127.0.0.1:{{ alertmanager_notify_port }}/notify"
alertmanager_notify_log_dir: /var/log/alertmanager-notify
alloy_log_files:
  - { path: "{{ alertmanager_notify_log_dir }}/notifications.log", job: alertmanager-notify, mkdir: true }
