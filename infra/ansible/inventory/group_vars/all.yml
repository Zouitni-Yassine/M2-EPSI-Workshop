# Réseaux autorisés en SSH (firewall des hôtes)
fw_ssh_allowed:
  - 10.0.1.0/24

# Réseaux autorisés sur les ports de service des LXC (fw_open_ports)
fw_monitoring_allowed:
  - 10.0.1.0/24

# Segments RESILIENCE-ALPHA (infra/unifi/ra-network.yml) : les flux autorisés vers les LXC
# (fw_segment_rules de chaque groupe) reprennent exactement les règles de la passerelle UniFi
ra_app_cidr: 10.30.1.0/24 # Swarm
ra_dmz_cidr: 10.30.2.0/24 # exposé (NetBird, WAF)
ra_vpn_cidr: 10.30.3.0/24 # passerelle VPN

# VPN d'administration : uniquement les interfaces web (fw_admin_ports de chaque groupe).
# SSH et ports internes restent limités au LAN (rebond par le poste de contrôle).
fw_admin_web_allowed:
  - 10.10.0.0/24   # VPN LSN - UGC (administrateur)
  - 10.250.90.0/24 # VPN EPSI-WG (équipe)

# Autorité de certification interne (rôle internal_ca) : clé et certificats générés sur le
# poste de contrôle, certificat de la CA installé dans le magasin de confiance des hôtes
pki_dir: /root/.pki
pki_ca_name: EPSI Workshop - CA interne

# Stack d'observabilité : destination des logs, sources des scrapes
monitoring_core_ip: "{{ hostvars[groups['monitoring_core'][0]].ansible_host }}"
loki_push_url: "http://{{ monitoring_core_ip }}:3100/loki/api/v1/push"
monitoring_scrapers: "{{ groups['vmagents'] | map('extract', hostvars, 'ansible_host') | list }}"

# Configurations de la stack (scrape, règles, alertmanager, loki, alloy, dashboards) :
# rangées dans infra/monitoring, déployées par les rôles Ansible
monitoring_config_dir: "{{ playbook_dir | dirname }}/monitoring"

# Authentification Basic de la stack d'observabilité : un utilisateur, un mot de passe par service.
# Celui de Loki sert aussi aux nœuds Swarm (Alloy). Valeurs lues dans Vault par vault-env.
monitoring_auth_user: monitoring
loki_auth_password: "{{ lookup('ansible.builtin.env', 'LOKI_AUTH_PASSWORD') }}"
# VictoriaMetrics, vmagent et vmalert partagent le même mot de passe (aussi utilisé par le
# vmagent qui collecte les métriques applicatives dans le Swarm)
vm_auth_password: "{{ lookup('ansible.builtin.env', 'VM_AUTH_PASSWORD') }}"
# Compte Alertmanager du moteur de remédiation (utilisateur "remediation") : il lit les
# alertes par l'API au lieu d'exposer un port de webhook. Secret Swarm remediation_alertmanager_password.
remediation_am_password: "{{ lookup('ansible.builtin.env', 'REMEDIATION_AM_PASSWORD') }}"
# Compte en LECTURE SEULE de l'assistant RAG (outils MCP de rag01, docs/rag.md) : routes de
# requête de VictoriaMetrics (vmauth) et de Loki (nginx) uniquement. Secret Vault
# secret/infra/rag-readonly, un mot de passe par service.
rag_readonly_user: rag-readonly
rag_vm_read_password: "{{ lookup('ansible.builtin.env', 'RAG_VM_READ_PASSWORD') }}"
rag_loki_read_password: "{{ lookup('ansible.builtin.env', 'RAG_LOKI_READ_PASSWORD') }}"

# VictoriaMetrics (binaires officiels GitHub, checksum vérifié ; même version pour l'image Docker)
vm_version: v1.154.0
# Doit être égal à l'intervalle de scrape : les 2 vmagents envoient les mêmes séries,
# VictoriaMetrics n'en garde qu'un échantillon par intervalle.
scrape_interval: 30s
