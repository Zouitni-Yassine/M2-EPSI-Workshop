[defaults]
inventory         = inventory/hosts.yml
roles_path        = roles
remote_user       = debian
private_key_file  = /root/.ssh/id_ed25519_infra
host_key_checking = True
interpreter_python = auto_silent
callback_result_format = yaml
forks             = 10

[privilege_escalation]
become = True

[ssh_connection]
pipelining = True
