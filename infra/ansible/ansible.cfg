[defaults]
inventory         = inventory/hosts.yml
roles_path        = roles
remote_user       = debian
private_key_file  = /root/.ssh/id_ed25519_infra
host_key_checking = True
interpreter_python = auto_silent
callback_result_format = yaml
forks             = 10
# Handlers exécutés même si une tâche échoue après eux : sinon une config écrite au premier
# passage (en échec) n'est jamais appliquée, les passages suivants ne voyant plus de changement
force_handlers    = True

[privilege_escalation]
become = True

[ssh_connection]
pipelining = True
